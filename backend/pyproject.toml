[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlamp-backend"
version = "0.1.0"
description = "Smart Lamp Demo orchestrator (REST + WebSocket)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses Depends()/Body() as default values (official idiom).
# UP017: datetime.UTC is cosmetic and the project already uses timezone.utc.
ignore = ["B008", "UP017"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
