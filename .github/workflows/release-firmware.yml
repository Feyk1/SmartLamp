name: Release Firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc
      - name: Parsear la versión del tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag invalido: ${GITHUB_REF_NAME} (se espera vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          rest=${version#*.}
          echo "minor=${rest%%.*}" >> "$GITHUB_OUTPUT"
          echo "patch=${rest#*.}" >> "$GITHUB_OUTPUT"
      - name: Compilar la release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFW_VERSION_MAJOR=${{ steps.version.outputs.major }} \
            -DFW_VERSION_MINOR=${{ steps.version.outputs.minor }} \
            -DFW_VERSION_PATCH=${{ steps.version.outputs.patch }}
          cmake --build build
      - name: Preparar artefactos
        run: |
          mkdir -p dist
          cp build/bin/firmware dist/firmware.bin
          printf '{"version":"%s","commit":"%s","date":"%s"}\n' \
            "${{ steps.version.outputs.version }}" \
            "${{ github.sha }}" \
            "$(date -u +%FT%TZ)" > dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/

  package:
    name: Empaquetar y firmar
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pynacl
      - name: package_ota.py
        env:
          OTA_AES_KEY: ${{ secrets.OTA_AES_KEY }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          python tools/package_ota.py --input dist/firmware.bin \
            --version "${{ needs.build.outputs.version }}" \
            --output "dist/firmware-${{ needs.build.outputs.version }}.ota"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-ota
          path: dist/*.ota

  verify:
    name: Verificar (independiente)
    needs: [build, package]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-ota
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pynacl
      - name: Autotest de las herramientas
        run: python tools/test_ota.py
      - name: verify_ota.py (firma + AES-GCM + SHA-256)
        env:
          OTA_AES_KEY: ${{ secrets.OTA_AES_KEY }}
        run: |
          python tools/verify_ota.py \
            --input "firmware-${{ needs.build.outputs.version }}.ota" \
            --output payload.bin
      - uses: actions/upload-artifact@v4
        with:
          name: release-ota
          path: firmware-*.ota

  release:
    name: Publicar Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ota
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-*.ota
            dist/version.json
          generate_release_notes: true

  pages:
    name: Publicar en Pages
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-ota
          path: dist
      - name: Construir el sitio
        env:
          PUBLIC_ORCHESTRATOR_URL: ${{ vars.PUBLIC_ORCHESTRATOR_URL }}
          OTA_FILE: dist/firmware-${{ needs.build.outputs.version }}.ota
          OTA_VERSION: ${{ needs.build.outputs.version }}
        run: ./web/build_site.sh _site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Instalar dependencias de documentación
        run: pip install -r requirements-docs.txt
      - name: Construir la documentación
        env:
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/
        run: mkdocs build --strict --site-dir _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
