name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (YAML + Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            docs/**/*.md
            firmware/README.md

  build-firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc
      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build/bin/firmware
            build/bin/bootloader
            build/bin/supervisor
          retention-days: 7

  test-firmware:
    name: Test firmware (ctest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          cmake -B build-test -G Ninja -DBUILD_TESTS=ON
          cmake --build build-test
          cd build-test && ctest --output-on-failure
      - name: Logic module coverage
        run: |
          cmake -B build-cov -G Ninja -DBUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="--coverage -O0"
          cmake --build build-cov
          (cd build-cov && ctest --output-on-failure)
          pip install gcovr
          gcovr -r . build-cov \
            --filter 'firmware/src/bootloader/(ab|ota_verify)\.c$' \
            --filter 'firmware/src/flash/' \
            --filter 'firmware/src/comms/(cmd_handler|rest_client|net_transport_posix)\.c$' \
            --fail-under-line 70 \
            --print-summary

  test-backend:
    name: Test backend (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e "./backend[test,dev]"
      - name: Tests with coverage
        run: |
          cd backend
          pytest --cov=src --cov-report=term-missing --cov-fail-under=70
      - name: Ruff
        run: ruff check backend/src backend/tests
      - name: Mypy
        run: mypy backend/src

  test-tools:
    name: Test OTA tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install cryptography pynacl
      - name: Packaging/verification self-test
        run: python tools/test_ota.py

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Cppcheck firmware
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 \
            -I firmware/include firmware/src
      - name: Cppcheck driver
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 \
            -I driver/include driver/src
      - name: Clang-tidy (informational, PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          sudo apt-get install -y clang-tidy
          cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.c' \
            | grep -v -E '^(third_party|firmware/third_party)/' || true)
          if [ -n "$files" ]; then
            clang-tidy -p build --warnings-as-errors='*' $files
          fi

  docs:
    name: Documentation (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs build --strict

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config -q
      - name: Build images
        run: docker compose build

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - build-firmware
      - test-firmware
      - test-backend
      - test-tools
      - static-analysis
      - docs
      - docker
    steps:
      - run: echo "Todos los checks pasaron"
