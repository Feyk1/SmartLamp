name: Deploy instance image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-instance-image
  cancel-in-progress: false

env:
  IMAGE: registry.fly.io/lamp-instance-base

jobs:
  image:
    name: Instance image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Authenticate to the Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push
        run: |
          docker build -f infra/instance/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Summary
        run: echo "Publicada $IMAGE:latest (${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
